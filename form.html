<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("download.jpg") no-repeat center center fixed;
            background-size: cover;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            border: 2px solid rgba(236, 122, 80, 0.8);
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 8px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: rgb(37, 104, 158);;
            margin-bottom: 20px;
            text-align: center;
        }

        
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: teal;
            box-shadow: 0 0 5px rgba(0, 128, 128, 0.3);
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            background-color: rgba(236, 122, 80, 0.8);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #005a5a;
        }
    </style>
</head>
<body>

    <main class="form-container">
        <h2>Contact Us</h2>
        
        <form action="/submit-form" method="POST">
            
            <div class="form-group">
                <label test for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Wisdom Emmanuel">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="google@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
            </div>

            <div class="form-group">
                <label for="comment">Comment:</label>
                <textarea id="comment" name="comment" required placeholder="How can we help you?"></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
    </main>

</body>
</html>
